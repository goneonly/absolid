<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sit-up 영상 만들기</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #141519; color: #f2f3f5;
      font-family: 'Pretendard Variable', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    canvas { display: block; }
    .hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; }
    .panel { background: rgba(30, 32, 38, .86); border: 1px solid #2e3138; border-radius: 12px; padding: 10px 12px; font-size: 12px; line-height: 1.55; color: #9a9ea8; }
    .panel b { color: #f2f3f5; font-size: 14px; }
    .controls { position: fixed; left: 12px; right: 12px; bottom: 16px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
    button { font: inherit; font-size: 13px; font-weight: 600; color: #f2f3f5; background: #26282f; border: 1px solid #2e3138; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
    button.primary { background: #ff3b30; border-color: #ff3b30; }
    button:disabled { opacity: .5; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 14px; color: #9a9ea8; }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "mp4-muxer": "https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.mjs"
    } }
  </script>
</head>
<body>
  <div id="loading">Mixamo 애니메이션 불러오는 중…</div>
  <div class="hud">
    <div class="panel"><b>Sit-up · Mixamo</b><br /><span id="info">-</span></div>
    <div class="panel" style="text-align:right"><span id="status">미리보기</span></div>
  </div>
  <div class="controls">
    <button id="play">일시정지</button>
    <button id="view">카메라 전환</button>
    <button id="export" class="primary">영상 만들기 (mp4)</button>
  </div>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { Muxer, ArrayBufferTarget } from 'mp4-muxer';

// ───────── 설정 ─────────
const REP_SECONDS = 2.0;       // 1회 2초로 속도 맞춤
const VIDEO = { width: 1280, height: 720, fps: 30 };
const BRAND = 0xff3b30, BG = 0x141519;

// ───────── 장면 ─────────
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);
scene.fog = new THREE.Fog(BG, 5, 12);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const key = new THREE.DirectionalLight(0xfff3ea, 2.4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0003;
key.shadow.normalBias = 0.02;
scene.add(key, key.target);
const rim = new THREE.DirectionalLight(0xff8a70, 1.6);
scene.add(rim);
const fill = new THREE.DirectionalLight(0x9db4ff, 0.35);
scene.add(fill);

const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1b1c21, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ───────── 모델 + 애니메이션 ─────────
const fbx = await new FBXLoader().loadAsync('Situps.fbx');
fbx.scale.setScalar(0.01); // Mixamo FBX 는 cm 단위
const bodyMat = new THREE.MeshStandardMaterial({ color: 0xd9dadd, roughness: 0.45, metalness: 0.05 });
const jointMat = new THREE.MeshStandardMaterial({ color: BRAND, roughness: 0.4, metalness: 0.1 });
fbx.traverse((o) => {
  if (!o.isMesh) return;
  o.castShadow = o.receiveShadow = true;
  o.frustumCulled = false;
  o.material = /joint/i.test(o.name) ? jointMat : bodyMat;
});
scene.add(fbx);

const clip = fbx.animations[0];
const mixer = new THREE.AnimationMixer(fbx);
const action = mixer.clipAction(clip);
action.play();

// 반복 분석: 머리 높이가 가장 높아지는 순간(= 다 올라온 순간)들을 찾아 1회 시간 계산
const head = fbx.getObjectByName('mixamorigHead') || fbx.getObjectByName('mixamorig:Head');
const hips = fbx.getObjectByName('mixamorigHips') || fbx.getObjectByName('mixamorig:Hips');
const wp = new THREE.Vector3();
const SAMPLES = Math.round(clip.duration * 60);
const headY = [];
const box = new THREE.Box3(), bodyBox = new THREE.Box3();
for (let i = 0; i <= SAMPLES; i++) {
  mixer.setTime((i / SAMPLES) * clip.duration);
  fbx.updateMatrixWorld(true);
  headY.push(head.getWorldPosition(wp).y);
  box.setFromObject(fbx, true);
  bodyBox.union(box);
}
// 머리가 '중간 높이'를 아래→위로 넘는 횟수 = 반복 횟수 (꼭대기에서 버틸 때의 미세한 흔들림은 무시)
const minY = Math.min(...headY), maxY = Math.max(...headY), midY = (minY + maxY) / 2;
let reps = 0;
for (let i = 1; i < headY.length; i++) if (headY[i - 1] < midY && headY[i] >= midY) reps++;
reps = Math.max(1, reps);
const repPeriod = clip.duration / reps;
const timeScale = repPeriod / REP_SECONDS; // 1회가 REP_SECONDS 가 되도록
action.timeScale = timeScale;

// 누운 몸 방향 = 바닥 위 경계 상자의 긴 축 → 매트·카메라 배치
const size = bodyBox.getSize(new THREE.Vector3()), center = bodyBox.getCenter(new THREE.Vector3());
const alongX = size.x > size.z;
const matLen = Math.max(size.x, size.z) + 0.35, matW = Math.min(size.x, size.z) + 0.25;
const mat = new THREE.Mesh(new THREE.BoxGeometry(alongX ? matLen : matW, 0.012, alongX ? matW : matLen),
  new THREE.MeshStandardMaterial({ color: 0xb8322a, roughness: 0.75 }));
mat.position.set(center.x, 0.006, center.z);
mat.receiveShadow = true;
scene.add(mat);
// 매트 두께만큼 캐릭터를 올림
fbx.position.y += 0.012;

const side = alongX ? new THREE.Vector3(0, 0, 1) : new THREE.Vector3(1, 0, 0);
const along = alongX ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 0, 1);
const target = new THREE.Vector3(center.x, size.y * 0.42, center.z);
const VIEWS = [
  { name: '옆 3/4', file: 'side34', pos: target.clone().add(side.clone().multiplyScalar(2.0)).add(along.clone().multiplyScalar(0.7)).add(new THREE.Vector3(0, 0.55, 0)) },
  { name: '정측면', file: 'side', pos: target.clone().add(side.clone().multiplyScalar(2.3)).add(new THREE.Vector3(0, 0.15, 0)) },
  { name: '발쪽 앞', file: 'front', pos: target.clone().add(along.clone().multiplyScalar(2.1)).add(side.clone().multiplyScalar(0.9)).add(new THREE.Vector3(0, 0.75, 0)) },
];
let viewIdx = 0;
function setView(i) { camera.position.copy(VIEWS[i].pos); controls.target.copy(target); controls.update(); }
setView(0);
key.position.copy(target).add(side.clone().multiplyScalar(2)).add(new THREE.Vector3(0, 3.2, 0)).add(along.clone().multiplyScalar(1.2));
key.target.position.copy(target);
const sc = Math.max(size.x, size.z);
Object.assign(key.shadow.camera, { left: -sc, right: sc, top: sc, bottom: -sc, near: 0.5, far: 10 });
rim.position.copy(target).add(side.clone().multiplyScalar(-2.5)).add(new THREE.Vector3(0, 1.6, 0));
fill.position.copy(target).add(along.clone().multiplyScalar(2)).add(new THREE.Vector3(0, 0.6, 0));

const info = { clipSeconds: +clip.duration.toFixed(2), reps, repPeriod: +repPeriod.toFixed(2), timeScale: +timeScale.toFixed(3),
  size: size.toArray().map((v) => +v.toFixed(2)), alongX, bones: !!head && !!hips };
window.__info = info;
document.getElementById('info').textContent = `원본 ${info.clipSeconds}초 · ${reps}회 (1회 ${info.repPeriod}초) → 1회 ${REP_SECONDS}초로 조정`;
document.getElementById('loading').remove();

// ───────── 미리보기 ─────────
let playing = true, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (playing && !exporting) mixer.update(dt);
  controls.update();
  if (!exporting) renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ───────── 영상 만들기: 프레임을 하나씩 정확히 그려서 H.264 mp4 로 인코딩 ─────────
let exporting = false;
async function exportVideo() {
  if (!('VideoEncoder' in window)) { alert('이 브라우저는 영상 인코딩(WebCodecs)을 지원하지 않아요.'); return; }
  exporting = true;
  const btn = document.getElementById('export'), status = document.getElementById('status');
  btn.disabled = true;
  const { width, height, fps } = VIDEO;
  const prev = { pr: renderer.getPixelRatio(), w: innerWidth, h: innerHeight, aspect: camera.aspect };
  renderer.setPixelRatio(1);
  renderer.setSize(width, height, false);
  camera.aspect = width / height; camera.updateProjectionMatrix();

  const muxer = new Muxer({ target: new ArrayBufferTarget(), video: { codec: 'avc', width, height }, fastStart: 'in-memory' });
  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => { console.error(e); status.textContent = '인코딩 오류: ' + e.message; },
  });
  encoder.configure({ codec: 'avc1.640028', width, height, bitrate: 6_000_000, framerate: fps });

  // 원본 클립 전체(반복 전부)를 한 번 = 끊김 없이 반복 재생되는 영상
  const total = Math.round((clip.duration / timeScale) * fps);
  for (let i = 0; i < total; i++) {
    mixer.setTime(i / fps); // action.timeScale 가 이미 적용돼 있어 실제 시간 그대로 넣음
    renderer.render(scene, camera);
    const vf = new VideoFrame(renderer.domElement, { timestamp: Math.round((i * 1e6) / fps), duration: Math.round(1e6 / fps) });
    encoder.encode(vf, { keyFrame: i % (fps * 2) === 0 });
    vf.close();
    if (encoder.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 0));
    if (i % 10 === 0) { status.textContent = `인코딩 ${Math.round((i / total) * 100)}%`; await new Promise((r) => setTimeout(r, 0)); }
  }
  await encoder.flush();
  muxer.finalize();
  const buf = muxer.target.buffer;
  status.textContent = '저장 중…';
  const name = `situps-${VIEWS[viewIdx].file}.mp4`; // 앱에서 쓰기 쉽게 영문 파일명
  const res = await fetch('/save?name=' + encodeURIComponent(name), { method: 'POST', body: buf });
  const ok = res.ok;
  status.textContent = ok ? `저장 완료: out/${name} (${(buf.byteLength / 1048576).toFixed(2)}MB, ${(total / fps).toFixed(1)}초)` : '저장 실패';
  window.__export = { ok, name, bytes: buf.byteLength, frames: total, seconds: total / fps };

  renderer.setPixelRatio(prev.pr);
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  btn.disabled = false;
  exporting = false;
}

// ───────── 버튼 ─────────
const $ = (id) => document.getElementById(id);
$('play').onclick = (e) => { playing = !playing; e.target.textContent = playing ? '일시정지' : '재생'; };
$('view').onclick = () => { viewIdx = (viewIdx + 1) % VIEWS.length; setView(viewIdx); $('status').textContent = `카메라: ${VIEWS[viewIdx].name}`; };
$('export').onclick = exportVideo;
window.__exportVideo = exportVideo;
window.__exportAll = async () => { const out = []; for (let i = 0; i < VIEWS.length; i++) { viewIdx = i; setView(i); await exportVideo(); out.push(window.__export); } return out; };
addEventListener('resize', () => {
  if (exporting) return;
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
