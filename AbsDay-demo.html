<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />

<title>AbsDay — 매일 복근, 같이 (데모)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
:root {
  --bg: #141519;          /* charcoal black */
  --surface: #1e2026;     /* card */
  --surface-2: #26282f;
  --border: #2e3138;
  --text: #f2f3f5;
  --text-dim: #9a9ea8;
  --red: #ff3b30;         /* signature */
  --red-deep: #d92b21;
  --gray-dot: #4a4d55;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

#root { max-width: 480px; margin: 0 auto; min-height: 100dvh; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input { font-family: inherit; }

.app { min-height: 100dvh; display: flex; flex-direction: column; padding-bottom: 88px; }

/* ── Header ── */
.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 10px;
}
.logo { display: flex; align-items: center; gap: 8px; background: none; }
.logo strong { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
.logo strong em { color: var(--red); font-style: normal; }

.page { flex: 1; padding: 8px 20px 24px; }
.page h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 4px; }
.sub { color: var(--text-dim); font-size: 14px; line-height: 1.5; }

/* ── Card ── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-top: 16px;
}

/* ── Home / streak ── */
.streak-card { text-align: center; padding: 32px 20px; }
.streak-num { font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
.streak-num span { color: var(--red); }
.streak-label { color: var(--text-dim); font-size: 14px; margin-top: 8px; }
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; font-weight: 600; border-radius: 999px; padding: 6px 14px; margin-top: 16px;
}
.badge.done { background: rgba(255,59,48,.15); color: var(--red); }
.badge.todo { background: var(--surface-2); color: var(--text-dim); }

.week { display: flex; justify-content: space-between; margin-top: 8px; }
.week .day { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); }
.dot { width: 28px; height: 28px; border-radius: 50%; background: var(--gray-dot); display: flex; align-items: center; justify-content: center; font-size: 13px; }
.dot.done { background: var(--red); color: #fff; font-weight: 700; }
.dot.today { outline: 2px solid var(--red); outline-offset: 2px; }

.cta {
  width: 100%; margin-top: 20px; padding: 16px; border-radius: 14px;
  background: var(--red); color: #fff; font-size: 17px; font-weight: 700;
  transition: transform .1s ease;
}
.cta:active { transform: scale(.98); }
.cta.secondary { background: var(--surface-2); color: var(--text); }

/* ── Workout ── */
.hero { margin: 16px -20px 0; position: relative; background: #000; }
.hero .ratio { position: relative; width: 100%; padding-top: 56.25%; }
.hero iframe, .hero .yt-holder { position: absolute; inset: 0; width: 100%; height: 100%; }
.day-chip {
  position: absolute; top: 12px; left: 12px; z-index: 2;
  background: var(--red); color: #fff; font-size: 13px; font-weight: 800;
  padding: 5px 12px; border-radius: 999px; pointer-events: none;
}
.workout-note { margin-top: 16px; }
.demo-link { display: block; margin: 20px auto 0; color: var(--text-dim); font-size: 12px; text-decoration: underline; }

/* ── Group ── */
.member { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.member:last-child { border-bottom: none; }
.member .status { width: 12px; height: 12px; border-radius: 50%; background: var(--gray-dot); flex: none; }
.member .status.done { background: var(--red); }
.member .name { font-size: 15px; font-weight: 600; flex: 1; }
.member .state-label { font-size: 12px; color: var(--text-dim); }
.member .state-label.done { color: var(--red); font-weight: 600; }
.legend { display: flex; gap: 16px; margin-top: 12px; font-size: 12px; color: var(--text-dim); align-items: center; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
.tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--text-dim); background: var(--surface-2); border-radius: 6px; padding: 3px 8px; margin-left: 8px; vertical-align: middle; }

/* ── Settings ── */
.field { margin-top: 14px; }
.field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
.field input {
  width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 15px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
}
.field input:focus { outline: none; border-color: var(--red); }
.input {
  width: 100%; padding: 13px 14px; border-radius: 12px; font-size: 15px;
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
}
.input:focus { outline: none; border-color: var(--red); }
.linklike { background: none; border: none; color: var(--text-dim); font-size: 12px; cursor: pointer; }
.linklike strong { color: var(--red); font-size: 13px; }
.row-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0; border-bottom: 1px solid var(--border); font-size: 15px;
}
.row-btn:last-child { border-bottom: none; }
.row-btn .hint { font-size: 12px; color: var(--text-dim); }
.row-btn.danger { color: var(--red); }
.row-btn:disabled { opacity: .5; cursor: default; }

/* ── Bottom nav ── */
.bottom-nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; height: 80px;
  background: rgba(20,21,25,.92); backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  display: grid; grid-template-columns: 1fr 1fr 1fr; align-items: center;
  padding-bottom: env(safe-area-inset-bottom); z-index: 50;
}
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); }
.nav-btn.active { color: var(--text); }
.nav-btn svg { width: 24px; height: 24px; }
.nav-start {
  width: 64px; height: 64px; border-radius: 50%; margin: -28px auto 0;
  background: var(--red); color: #fff; font-weight: 800; font-size: 13px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  box-shadow: 0 6px 20px rgba(255,59,48,.45);
  transition: transform .1s ease;
}
.nav-start:active { transform: scale(.94); }
.nav-start svg { width: 22px; height: 22px; }

/* ── Modal ── */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100;
  display: flex; align-items: flex-end; justify-content: center;
}
.modal {
  width: 100%; max-width: 480px; background: var(--surface);
  border-radius: 20px 20px 0 0; padding: 28px 20px calc(28px + env(safe-area-inset-bottom));
  animation: up .25s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal h3 { font-size: 20px; font-weight: 800; text-align: center; }
.modal .sub { text-align: center; margin-top: 6px; }
.photo-box {
  margin-top: 18px; border: 1.5px dashed var(--border); border-radius: 14px;
  min-height: 140px; display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 14px; overflow: hidden; background: var(--surface-2);
}
.photo-box img { width: 100%; display: block; }
#boot { padding: 40px 20px; color: #9a9ea8; font-size: 14px; text-align: center; }
#errbox { display: none; position: fixed; left: 10px; right: 10px; bottom: 10px; z-index: 9999;
  background: #3a1210; border: 1px solid #ff3b30; color: #ffb4ae; border-radius: 12px;
  padding: 12px 14px; font-size: 12px; white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto; }
</style>
<script>
// ── 진단 장치: 오류를 화면에 표시 ──
function showErr(msg) {
  var box = document.getElementById('errbox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent += (box.textContent ? '\n\n' : '') + msg;
}
window.addEventListener('error', function (e) {
  showErr('[오류] ' + (e.message || '') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
}, true);
window.addEventListener('unhandledrejection', function (e) {
  showErr('[비동기 오류] ' + (e.reason && (e.reason.message || e.reason)));
});
var _cerr = console.error.bind(console);
console.error = function () {
  try { showErr('[console] ' + Array.prototype.map.call(arguments, String).join(' ').slice(0, 1500)); } catch (_) {}
  _cerr.apply(null, arguments);
};
function cdnFail(name) { showErr('[로드 실패] ' + name + ' — 인터넷 연결 또는 보안 프로그램을 확인하세요.'); }
</script>

<script type="text/babel" data-presets="react">
(() => {
const { useState, useEffect, useRef, useCallback } = React;
// 실제 Supabase 서버 연결 (anon 키는 공개용 키)
const SUPABASE_URL = 'https://pqxtzuomckmroqjjkjdq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_1Agw42xVvWiAqLUuMV8w8Q_eeBkKq2F';
const supabase = (window.supabase && SUPABASE_URL && SUPABASE_KEY)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
  : null;
// 로컬(기기) 저장소 — Day 2에서 Supabase로 확장 예정
const RECORDS_KEY = 'absday.records.v1'
const PROFILE_KEY = 'absday.profile.v1'

function todayKey(d = new Date()) {
  const y = d.getFullYear()
  const m = String(d.getMonth() + 1).padStart(2, '0')
  const day = String(d.getDate()).padStart(2, '0')
  return `${y}-${m}-${day}`
}

// 오늘 날짜의 "일" 기준 운동 Day 번호 (31일 → day 30)
function todayWorkoutDay(d = new Date()) {
  return Math.min(d.getDate(), 30)
}

function getRecords() {
  try { return JSON.parse(localStorage.getItem(RECORDS_KEY)) || {} } catch { return {} }
}

function saveRecord(dateKey, rec) {
  const all = getRecords()
  all[dateKey] = { ...(all[dateKey] || {}), ...rec }
  localStorage.setItem(RECORDS_KEY, JSON.stringify(all))
  return all
}

function clearRecords() {
  localStorage.removeItem(RECORDS_KEY)
}

function computeStreak(records = getRecords()) {
  let streak = 0
  const d = new Date()
  // 오늘 안 했으면 어제부터 카운트 (streak는 아직 깨지지 않음)
  if (!records[todayKey(d)]?.completed) d.setDate(d.getDate() - 1)
  while (records[todayKey(d)]?.completed) {
    streak++
    d.setDate(d.getDate() - 1)
  }
  return streak
}

function lastNDays(n, records = getRecords()) {
  const out = []
  const d = new Date()
  d.setDate(d.getDate() - (n - 1))
  for (let i = 0; i < n; i++) {
    const key = todayKey(d)
    out.push({ key, date: new Date(d), done: !!records[key]?.completed })
    d.setDate(d.getDate() + 1)
  }
  return out
}

function getProfile() {
  try { return JSON.parse(localStorage.getItem(PROFILE_KEY)) || { nickname: '' } } catch { return { nickname: '' } }
}

function saveProfile(p) {
  localStorage.setItem(PROFILE_KEY, JSON.stringify(p))
}

// 서버 기록을 로컬로 병합 (로컬에만 있는 사진 등은 유지)
function mergeRecords(server) {
  if (!server) return
  const all = getRecords()
  for (const [k, v] of Object.entries(server)) {
    all[k] = { ...v, ...(all[k] || {}) }
  }
  localStorage.setItem(RECORDS_KEY, JSON.stringify(all))
}
const PLAYLIST_ID = 'PLmP-4qxDY1uctg8gjjxQP2nrFmJ0aAB_6'

let apiPromise = null
function loadYouTubeAPI() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT)
  if (apiPromise) return apiPromise
  apiPromise = new Promise((resolve) => {
    const prev = window.onYouTubeIframeAPIReady
    window.onYouTubeIframeAPIReady = () => {
      if (prev) prev()
      resolve(window.YT)
    }
    const tag = document.createElement('script')
    tag.src = 'https://www.youtube.com/iframe_api'
    document.head.appendChild(tag)
  })
  return apiPromise
}
// 인증 헬퍼 — supabase 미연결 시 모두 no-op

const ERROR_KO = {
  'Invalid login credentials': '이메일 또는 비밀번호가 올바르지 않아요.',
  'User already registered': '이미 가입된 이메일이에요.',
  'Password should be at least 6 characters.': '비밀번호는 6자 이상이어야 해요.',
  'Email not confirmed': '이메일 인증이 필요해요. 메일함을 확인해 주세요.',
  'Unable to validate email address: invalid format': '이메일 형식이 올바르지 않아요.',
}
function ko(msg) { return ERROR_KO[msg] || `오류: ${msg}` }

async function signUp(email, password, nickname) {
  const { data, error } = await supabase.auth.signUp({ email, password })
  if (error) return { error: ko(error.message) }
  if (data.user) {
    await supabase.from('profiles').upsert({ id: data.user.id, nickname: nickname || '' })
  }
  return { data }
}

async function signIn(email, password) {
  const { data, error } = await supabase.auth.signInWithPassword({ email, password })
  if (error) return { error: ko(error.message) }
  return { data }
}

async function signOut() {
  await supabase.auth.signOut()
}

async function saveNickname(nickname) {
  const { data } = await supabase.auth.getSession()
  const user = data.session?.user
  if (!user) return
  await supabase.from('profiles').upsert({ id: user.id, nickname, updated_at: new Date().toISOString() })
}

function useAuth() {
  const [session, setSession] = useState(null)
  useEffect(() => {
    if (!supabase) return
    supabase.auth.getSession().then(({ data }) => setSession(data.session))
    const { data: sub } = supabase.auth.onAuthStateChange((_event, s) => setSession(s))
    return () => sub.subscription.unsubscribe()
  }, [])
  return session
}
// 서버 기록 동기화 — 로그인 상태일 때만 동작, 아니면 조용히 패스

async function uid() {
  if (!supabase) return null
  const { data } = await supabase.auth.getSession()
  return data.session?.user?.id || null
}

async function pushRecord(dateKey, day, completedAt) {
  const user_id = await uid()
  if (!user_id) return
  await supabase.from('workouts').upsert(
    { user_id, date: dateKey, day, completed_at: completedAt || new Date().toISOString() },
    { onConflict: 'user_id,date' }
  )
}

async function fetchServerRecords() {
  const user_id = await uid()
  if (!user_id) return null
  const { data, error } = await supabase
    .from('workouts')
    .select('date, day, completed_at, photo_url')
    .eq('user_id', user_id)
  if (error || !data) return null
  const out = {}
  for (const r of data) {
    out[r.date] = { completed: true, day: r.day, completedAt: r.completed_at }
    if (r.photo_url) out[r.date].photoUrl = r.photo_url
  }
  return out
}

// 비회원 시절 로컬 기록을 서버로 올리기 (로그인 직후 1회)
async function syncLocalToServer() {
  const user_id = await uid()
  if (!user_id) return
  const rows = Object.entries(getRecords())
    .filter(([, v]) => v.completed)
    .map(([date, v]) => ({
      user_id, date, day: v.day || 1,
      completed_at: v.completedAt || new Date().toISOString(),
    }))
  if (rows.length) await supabase.from('workouts').upsert(rows, { onConflict: 'user_id,date' })
}

// ── 사진 업로드 (Day 5) ─────────────────────
async function uploadPhoto(dateKey, dataUrl) {
  const user_id = await uid()
  if (!user_id || !dataUrl) return null
  try {
    const blob = await (await fetch(dataUrl)).blob()
    const path = `${user_id}/${dateKey}.jpg`
    const { error } = await supabase.storage
      .from('photos')
      .upload(path, blob, { upsert: true, contentType: 'image/jpeg' })
    if (error) return null
    const { data } = supabase.storage.from('photos').getPublicUrl(path)
    const photo_url = data?.publicUrl || null
    if (photo_url) {
      await supabase.from('workouts')
        .update({ photo_url })
        .eq('user_id', user_id).eq('date', dateKey)
    }
    return photo_url
  } catch (_) { return null }
}

// ── 그룹 (Day 3~4) ──────────────────────────
async function pushProfile(nickname) {
  const user_id = await uid()
  if (!user_id) return
  await supabase.from('profiles').upsert({ id: user_id, nickname: nickname || '' })
}

function makeInviteCode() {
  const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'
  let out = ''
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)]
  return out
}

async function fetchMyGroup() {
  const user_id = await uid()
  if (!user_id) return null
  const { data: mem } = await supabase
    .from('group_members').select('group_id').eq('user_id', user_id).limit(1)
  if (!mem?.length) return null
  const { data: g } = await supabase
    .from('groups').select('id, name, invite_code, max_members').eq('id', mem[0].group_id).single()
  return g || null
}

async function createGroup(name, nickname) {
  const user_id = await uid()
  if (!user_id) throw new Error('로그인이 필요해요.')
  await pushProfile(nickname)
  for (let i = 0; i < 3; i++) {
    const invite_code = makeInviteCode()
    const { data, error } = await supabase
      .from('groups')
      .insert({ name, invite_code, created_by: user_id })
      .select('id, name, invite_code, max_members').single()
    if (!error && data) {
      await supabase.from('group_members').insert({ group_id: data.id, user_id })
      return data
    }
    if (error && !String(error.message).includes('duplicate')) throw new Error('그룹 생성에 실패했어요. 잠시 후 다시 시도해 주세요.')
  }
  throw new Error('그룹 생성에 실패했어요. 다시 시도해 주세요.')
}

async function joinGroup(code, nickname) {
  const user_id = await uid()
  if (!user_id) throw new Error('로그인이 필요해요.')
  const clean = (code || '').trim().toUpperCase()
  if (clean.length !== 6) throw new Error('초대 코드는 6자리예요.')
  const { data: g } = await supabase
    .from('groups').select('id, name, invite_code, max_members').eq('invite_code', clean).maybeSingle()
  if (!g) throw new Error('초대 코드를 찾을 수 없어요. 다시 확인해 주세요.')
  await pushProfile(nickname)
  const { error } = await supabase.from('group_members').insert({ group_id: g.id, user_id })
  if (error && !String(error.message).includes('duplicate')) throw new Error('참여에 실패했어요. 잠시 후 다시 시도해 주세요.')
  return g
}

async function leaveGroup(groupId) {
  const user_id = await uid()
  if (!user_id) return
  await supabase.from('group_members').delete().eq('group_id', groupId).eq('user_id', user_id)
}

async function fetchGroupStatus(groupId) {
  const { data: mem } = await supabase
    .from('group_members').select('user_id').eq('group_id', groupId)
  const ids = (mem || []).map(m => m.user_id)
  if (!ids.length) return []
  const since = new Date(); since.setDate(since.getDate() - 6)
  const sinceKey = since.toISOString().slice(0, 10)
  const [{ data: profs }, { data: works }] = await Promise.all([
    supabase.from('profiles').select('id, nickname').in('id', ids),
    supabase.from('workouts').select('user_id, date').in('user_id', ids).gte('date', sinceKey),
  ])
  const names = Object.fromEntries((profs || []).map(p => [p.id, p.nickname]))
  const doneDates = {}
  for (const w of works || []) (doneDates[w.user_id] = doneDates[w.user_id] || new Set()).add(w.date)

// 사진을 긴 변 720px 이하 JPEG dataURL로 압축 (localStorage 용량 보호)
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file)
    const img = new Image()
    img.onload = () => {
      const MAX = 720
      const scale = Math.min(1, MAX / Math.max(img.width, img.height))
      const canvas = document.createElement('canvas')
      canvas.width = Math.round(img.width * scale)
      canvas.height = Math.round(img.height * scale)
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
      URL.revokeObjectURL(url)
      resolve(canvas.toDataURL('image/jpeg', 0.8))
    }
    img.onerror = reject
    img.src = url
  })
}

function Workout({ onDone }) {
  const holderRef = useRef(null)
  const playerRef = useRef(null)
  const startedRef = useRef(false)
  const finishedRef = useRef(false)
  const [showModal, setShowModal] = useState(false)
  const day = todayWorkoutDay()

  useEffect(() => {
    let cancelled = false
    loadYouTubeAPI().then(YT => {
      if (cancelled || !holderRef.current) return
      playerRef.current = new YT.Player(holderRef.current, {
        width: '100%',
        height: '100%',
        playerVars: { rel: 0, playsinline: 1, modestbranding: 1 },
        events: {
          onReady: e => {
            // 플레이리스트의 (day-1)번째 영상 = 오늘의 Day 영상
            e.target.cuePlaylist({ listType: 'playlist', list: PLAYLIST_ID, index: day - 1 })
          },
          onStateChange: e => {
            const YTState = window.YT.PlayerState
            if (finishedRef.current) return
            if (e.data === YTState.PLAYING) {
              // 재생이 시작된 뒤 다음 영상으로 자동 전환되면 = 오늘 영상 끝
              const idx = e.target.getPlaylistIndex()
              if (startedRef.current && idx !== day - 1) {
                e.target.pauseVideo()
                finish()
              } else {
                startedRef.current = true
              }
            }
            if (e.data === YTState.ENDED) finish() // 플레이리스트 마지막 영상(day 30)인 경우
          },
        },
      })
    })
    return () => {
      cancelled = true
      try { playerRef.current?.destroy() } catch { /* noop */ }
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [])

  function finish() {
    if (finishedRef.current) return
    finishedRef.current = true
    setShowModal(true)
  }

  function handleSave(photo) {
    const completedAt = new Date().toISOString()
    // 로그인 상태면 서버에도 저장 + 인증샷 업로드 (Day 5)
    pushRecord(todayKey(), day, completedAt)
      .then(() => uploadPhoto(todayKey(), photo))
      .catch(() => {})
    saveRecord(todayKey(), {
      completed: true,
      completedAt,
      day,
      ...(photo ? { photo } : {}),
    })
    setShowModal(false)
    onDone()
  }

  return (
    <main className="page">
      <h2>Day {day} 복근 운동</h2>
      <p className="sub">영상이 끝나면 자동으로 운동 완료 처리돼요.</p>

      <div className="hero">
        <span className="day-chip">DAY {day}</span>
        <div className="ratio">
          <div className="yt-holder" ref={holderRef} />
        </div>
      </div>

      <section className="card workout-note">
        <div style={{ fontWeight: 700, fontSize: 15 }}>오늘의 루틴</div>
        <p className="sub" style={{ marginTop: 6 }}>
          XYZ FITNESS · 30 Days Six Pack Abs 프로그램의 Day {day} 영상입니다.
          중간에 나가면 완료로 기록되지 않아요. 끝까지 함께해요! 💪
        </p>
      </section>

      <button className="demo-link" onClick={finish}>
        (데모용) 영상 끝까지 본 것으로 처리하기
      </button>

      {showModal && (
        <CompleteModal
          day={day}
          onSave={handleSave}
          onSkip={() => handleSave(null)}
        />
      )}
    </main>
  )
}

  // 기록을 CSV로 내려받기 — 구글시트에서 파일 > 가져오기로 바로 열 수 있어요 (Day 6)
  function exportCSV() {
    const records = getRecords()
    const rows = [['날짜', 'Day', '완료 시각', '사진']]
    for (const k of Object.keys(records).sort()) {
      const r = records[k]
      if (r.completed) rows.push([k, r.day || '', r.completedAt || '', r.photoUrl || ''])
    }
    const csv = '﻿' + rows.map(r => r.join(',')).join('\r\n') // BOM: 한글 깨짐 방지
    const a = document.createElement('a')
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }))
    a.download = `absday-records-${todayKey()}.csv`
    a.click()
    URL.revokeObjectURL(a.href)
  }

  function reset() {
    if (confirm('이 기기의 운동 기록을 삭제할까요? 되돌릴 수 없어요.')) {

      onChanged()

      <button className="cta secondary" style={{ marginTop: 10 }}
        onClick={() => { setMode(mode === 'signup' ? 'signin' : 'signup'); setError(''); setNotice('') }}>
        {mode === 'signup' ? '이미 계정이 있어요 → 로그인' : '처음이에요 → 회원가입'}
      </button>
    </section>
  )
}

function App() {
  // view: home | workout | group | settings
  const [view, setView] = useState('home')
  const [, setTick] = useState(0)
  const refresh = useCallback(() => setTick(t => t + 1), [])
  const session = useAuth()
  const records = getRecords()

  // 로그인되면: 서버 기록 내려받아 병합 + 비회원 시절 로컬 기록 서버로 업로드
  useEffect(() => {
    if (!session) return
    let alive = true
    syncLocalToServer()
      .then(fetchServerRecords)
      .then(server => { if (alive && server) { mergeRecords(server); refresh() } })
      .catch(() => {})
    return () => { alive = false }
  }, [session, refresh])

  return (
    <div className="app">
      <header className="header">
        <button className="logo" onClick={() => setView('home')} aria-label="홈으로">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="24" height="24" rx="7" fill="#ff3b30" />
            <path d="M8 18 L13 7 L18 18" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" strokeLinejoin="round" fill="none" />
            <path d="M10 14.5 H16" stroke="#fff" strokeWidth="2.6" strokeLinecap="round" />
          </svg>
          <strong>Abs<em>Day</em></strong>
        </button>
        {session && <span className="tag">로그인됨</span>}
      </header>

      {view === 'home' && <Home records={records} onStart={() => setView('workout')} />}
      {view === 'workout' && <Workout onDone={() => { refresh(); setView('home') }} />}
      {view === 'group' && <Group records={records} session={session} />}
      {view === 'settings' && <Settings session={session} onChanged={refresh} />}

      <BottomNav view={view} onChange={setView} />
    </div>
  )
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script>
</body>
</html>
